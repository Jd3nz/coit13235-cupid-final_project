spring.application.name=cupid-matching-test

spring.datasource.url=jdbc:mysql://localhost:3306/cupid_matching_test?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=cupid
spring.datasource.password=cupid
cupid.profile.account-deletion-enabled=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

spring.jpa.properties.jakarta.persistence.query.timeout=5000

cupid.matching.swipe-encouragement-enabled=false
