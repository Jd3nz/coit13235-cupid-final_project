spring.application.name=cupid-matching

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cupid_matching?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:cupid}
spring.datasource.password=${DB_PASSWORD:cupid}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# NFR_Persistence_Timeout: fail database connection attempts within five seconds.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

spring.thymeleaf.cache=false

# Spring Data JPA / Hibernate
# schema.sql owns the MySQL schema; Hibernate only validates mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# FR_Swipe_More_Ethics: disabled by default.
cupid.matching.swipe-encouragement-enabled=false

# FR_Profile_Keep_Ethics: set this one setting to false to disable account
# deletion for every user. Individual users must still complete safeguards.
cupid.profile.account-deletion-enabled=true

# Apply the existing five-second statement limit to JPA queries as well.
spring.jpa.properties.jakarta.persistence.query.timeout=5000

# FR_Profile_Picture: multipart upload limits protect the request boundary.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# FR_Profile_Picture: picture-storage rules Tanzim's service enforces.
cupid.profile.pictures.max-file-size-bytes=5242880
cupid.profile.pictures.max-pictures-per-profile=6
cupid.profile.pictures.allowed-content-types=image/jpeg,image/png,image/webp
